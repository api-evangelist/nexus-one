name: Nexus One
description: >-
  NexusOne, by Nexus Cognitive, is a composable open data architecture that lays
  horizontally across an entire enterprise data estate — connecting on-prem, cloud,
  hybrid, and legacy systems through one universal identity, governance, and
  operational control plane. Built on 85+ deeply integrated open-source tools
  (Iceberg, Trino, Spark, Ranger, Keycloak, DataHub, Gravitino, Airflow, and more),
  it positions itself as "The Data Layer for AI," making every system operate as a
  single coherent, agent-callable system without data migration or vendor lock-in.
  Founded in 2022, headquartered in Atlanta, GA, and backed by Insight Partners.
